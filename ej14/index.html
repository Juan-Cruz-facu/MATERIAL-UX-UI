<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 14 - Variables CSS y temas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="pagina">
    <header class="header">
      <h1>Mi sitio con variables CSS</h1>
    </header>

    <main class="contenido">
      <div class="card">
        <h2>Tarjeta de ejemplo</h2>
        <p>Este texto usa colores y espaciados definidos como variables CSS.</p>
        <button class="btn">Acción</button>
      </div>
    </main>

    <button class="btn-tema" onclick="document.querySelector('.pagina').classList.toggle('modo-oscuro')">
      Cambiar tema
    </button>
  </div>
</body>
</html>
