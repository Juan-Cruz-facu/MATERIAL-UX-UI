<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 6 - Selectores CSS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="destacado">
    <p>Este párrafo está dentro del contenedor con <span>ID único</span>.</p>
  </div>

  <div class="card">
    <p>Este párrafo está dentro de una tarjeta (clase "card").</p>
  </div>

  <div class="card">
    <p>Otra tarjeta más, para ver que el selector descendiente aplica a todas.</p>
  </div>

  <p class="destacado-texto">Un párrafo suelto con una clase aplicada directamente.</p>
</body>
</html>
